[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monkey-flatmap-autogen"
version = "0.1.0"
description = "Automatic, landmark-defined cortical flatmaps for macaque FreeSurfer subjects: anatomical cuts, SLIM flattening, quality gates, canonical orientation, pycortex import and parcel overlays."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ruichang Sun", email = "ruichang_sun@berkeley.edu" }]
keywords = ["flatmap", "macaque", "cortex", "FreeSurfer", "pycortex", "SLIM", "surface flattening"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "nibabel>=5.0",
  "matplotlib>=3.7",
  "lxml>=4.9",
  "libigl>=2.6",
]

[project.optional-dependencies]
# pycortex is needed for `mfa import-subject`, `mfa apply`, `mfa overlay-parcels` and
# `mfa atlas-annot`; the development version from GitHub is recommended (see README).
pycortex = ["pycortex", "shapely>=2.0"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Atobesrc/monkey-flatmap-autogen"

[project.scripts]
mfa = "mfa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mfa = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["B023", "B028", "B905", "E741", "NPY002", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration tests on a synthetic subject (seconds to a minute)"]
